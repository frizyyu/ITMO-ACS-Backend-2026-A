name: HW6 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "БР1.2/Васильев Артём/homeworks/hw6/**"
      - "!БР1.2/Васильев Артём/homeworks/hw6/**/*.md"
      - "!БР1.2/Васильев Артём/homeworks/hw6/**/*.pdf"
      - ".github/workflows/deploy-hw6.yml"
  workflow_dispatch:

concurrency:
  group: hw6-main
  cancel-in-progress: false

env:
  APP_DIR: "БР1.2/Васильев Артём/homeworks/hw6"

jobs:
  service-ci:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-user-service
          - company-service
          - dictionary-service
          - vacancy-service
          - resume-service
          - application-service
          - interaction-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/services/${{ matrix.service }}/package-lock.json

      - name: Install exact dependencies
        working-directory: ${{ env.APP_DIR }}/services/${{ matrix.service }}
        run: npm ci

      - name: Build TypeScript
        working-directory: ${{ env.APP_DIR }}/services/${{ matrix.service }}
        run: npm run build

      - name: Build Docker image
        working-directory: ${{ env.APP_DIR }}/services/${{ matrix.service }}
        run: docker build --tag hw6-${{ matrix.service }}:${{ github.sha }} .

  compose-ci:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        working-directory: ${{ env.APP_DIR }}
        env:
          JWT_SECRET_KEY: ci-jwt-secret
          SERVICE_TOKEN: ci-service-token
          DB_PASSWORD: ci-db-password
          RABBITMQ_USER: ci-rabbit-user
          RABBITMQ_PASSWORD: ci-rabbit-password
        run: docker compose config --quiet

  deploy:
    name: Deploy to remote server
    needs:
      - service-ci
      - compose-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_SUBDIR: ${{ env.APP_DIR }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # The first deployment builds seven images sequentially to stay within
          # the server's 1.9 GB RAM limit, so allow enough time for a cold cache.
          command_timeout: 40m
          envs: APP_SUBDIR,COMMIT_SHA,REPO_URL,JWT_SECRET_KEY,SERVICE_TOKEN,DB_PASSWORD,RABBITMQ_USER,RABBITMQ_PASSWORD
          script: |
            set -Eeuo pipefail

            : "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
            : "${SERVICE_TOKEN:?SERVICE_TOKEN is required}"
            : "${DB_PASSWORD:?DB_PASSWORD is required}"
            : "${RABBITMQ_USER:?RABBITMQ_USER is required}"
            : "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"

            DEPLOY_ROOT=/opt/job-platform-hw6
            REPO_DIR="${DEPLOY_ROOT}/repo"
            APP_PATH="${REPO_DIR}/${APP_SUBDIR}"

            mkdir -p "${DEPLOY_ROOT}"

            if [ ! -d "${REPO_DIR}/.git" ]; then
              git clone --branch main --single-branch "${REPO_URL}" "${REPO_DIR}"
            else
              git -C "${REPO_DIR}" fetch --prune origin main
              git -C "${REPO_DIR}" reset --hard origin/main
              git -C "${REPO_DIR}" clean -fd
            fi

            test -f "${APP_PATH}/docker-compose.yml"

            umask 077
            cat > "${APP_PATH}/.env" <<EOF
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            SERVICE_TOKEN=${SERVICE_TOKEN}
            DB_PASSWORD=${DB_PASSWORD}
            RABBITMQ_USER=${RABBITMQ_USER}
            RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
            EOF

            docker compose --project-directory "${APP_PATH}" config --quiet

            for service in auth-user-service company-service dictionary-service vacancy-service resume-service application-service interaction-service; do
              COMPOSE_PARALLEL_LIMIT=1 docker compose --project-directory "${APP_PATH}" build "${service}"
            done

            if [ -f /opt/job-platform-lab4/app/docker-compose.yml ]; then
              docker compose --project-directory /opt/job-platform-lab4/app down --remove-orphans || true
            fi

            docker compose --project-directory "${APP_PATH}" up -d --remove-orphans

            for service in auth-user-service company-service dictionary-service vacancy-service resume-service application-service interaction-service; do
              docker compose --project-directory "${APP_PATH}" exec -T "${service}" npm run migrate
            done

            for attempt in $(seq 1 12); do
              if curl --fail --silent http://127.0.0.1:3003/api/v1/industries >/dev/null; then
                break
              fi
              if [ "${attempt}" -eq 12 ]; then
                echo "Local smoke test failed" >&2
                exit 1
              fi
              sleep 5
            done

            curl --fail --silent https://2.26.136.32/job-platform/api/v1/industries >/dev/null
            docker compose --project-directory "${APP_PATH}" ps
            echo "HW6 deployment completed for ${COMMIT_SHA}."
